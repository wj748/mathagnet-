#              "--maxmemory-policy", "allkeys-lru"]
#    healthcheck:
#      test: ["CMD", "redis-cli", "ping"]
#      interval: 5s
#      timeout: 3s
#      retries: 5
#    restart: unless-stopped

services:
  # 应用本体（profile full，默认不启动，避免改变原有用法）
  app:
    image: math-agent
    container_name: math-agent-app
    profiles: ["full"]
    ports:
      - "8787:8787"
    env_file:
      - path: .env
        required: false          # 无 .env 时自动降级离线规则模式
    environment:
      - HOST=0.0.0.0
      - PORT=8787
    volumes:
      - ./data:/app/data         # SQLite 题库 / 答题记录 / Qdrant 向量库
      - ./models:/app/models     # BGE embedding 模型（可选）
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped

volumes:
  redis-data:
