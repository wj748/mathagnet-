# ④ Redis 短期记忆（可选组件）
# 应用默认不启用（config.yaml redis.enabled=false，内存兜底零依赖可跑）。
# 如需启用，取消下面 redis 块的注释即可：
# 只起 Redis：docker compose up -d redis
#   然后在 config.yaml 把 redis.enabled 改为 true
# 连应用一起起：docker compose --profile full up -d   （首次需先 docker build -t math-agent .）
# 注：redis 块默认注释——发布为在线应用时，沙箱只提供单 HTTP 端口，不允许声明外部服务容器。
#services:
